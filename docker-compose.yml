services:
  bot:
    build: .
    container_name: video-download-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - downloads:/app/downloads
      # Netscape cookies for YouTube (create empty file if not ready yet)
      - ./cookies.txt:/app/cookies.txt:ro
    environment:
      YTDLP_COOKIES_FILE: /app/cookies.txt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  downloads:
